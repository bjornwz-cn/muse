{% extends "base.html" %}
{% block title %}总览{% endblock %}
{% block content %}
<h1>总览</h1>
<p class="lead">三库状态、今日新增、复核待处理与最近任务。<span class="meta" id="app-version"></span></p>

<div id="dash-error"></div>
<div id="upgrade-banner" aria-live="polite"></div>

<!-- 0.2.0：进行中任务（DB 任务 + 脚本心跳任务），一眼可见进度与 ETA。 -->
<section aria-label="进行中任务">
  <h2>进行中任务</h2>
  <div id="running-body"><p class="loading">加载中…</p></div>
</section>

<section aria-label="三库">
  <div class="cards" id="library-cards"><p class="loading">加载中…</p></div>
</section>

<section aria-label="今日与重复">
  <div class="cards" style="margin-top:12px">
    <div class="card">
      <h3>复核待处理</h3>
      <div class="big" id="stat-review">—</div>
      <div class="meta"><a href="/review">去复核队列 →</a></div>
    </div>
    <div class="card">
      <h3>今日新增</h3>
      <div class="big" id="stat-today">—</div>
      <div class="meta">今日新登记文件数</div>
    </div>
    <div class="card">
      <h3>重复可回收</h3>
      <div class="big" id="stat-dup">—</div>
      <div class="meta" id="stat-dup-count">—</div>
    </div>
  </div>
</section>

<h2>最近任务</h2>
<div class="table-wrap">
  <table>
    <thead><tr><th>任务</th><th>类型</th><th>状态</th><th>进度</th><th>开始</th><th>结束</th></tr></thead>
    <tbody id="jobs-body"><tr><td colspan="6" class="muted">加载中…</td></tr></tbody>
  </table>
</div>
{% endblock %}
{% block scripts %}
<script>
(function () {
  var C = window.Curator;
  var UPGRADE_STAGES = {
    queued: '已提交，等待升级', fetch: '拉取最新代码', build: '构建新镜像',
    backup: '备份数据库', deploy: '替换镜像并重建容器', verify: '验证新版本',
    rollback: '回滚到上一版', done: '完成'
  };
  var upgradeTarget = '';

  function renderUpgradeBanner(d) {
    var box = document.getElementById('upgrade-banner');
    if (!box) return;
    if (d.error && !d.latest) {
      box.innerHTML = '<div class="banner muted">检查新版本失败（' + C.esc(d.error) +
        '），稍后重试，不影响使用。</div>';
      return;
    }
    if (d.update_available) {
      box.innerHTML = '<div class="banner warn"><b>有新版本 ' + C.esc(d.latest) + ' 可用</b>' +
        (d.notes ? '（' + C.esc(d.notes) + '）' : '') +
        ' <button id="upgrade-btn" class="btn">一键升级</button>' +
        '<span class="meta">升级前自动备份数据库，失败自动回滚到上一版；升级过程约需数分钟，期间页面会短暂不可用。</span></div>';
      var btn = document.getElementById('upgrade-btn');
      if (btn) btn.addEventListener('click', startUpgrade);
    } else if (d.latest) {
      box.innerHTML = '<div class="banner ok">已是最新版本 ' + C.esc(d.latest) +
        (d.checked_at ? '（检查于 ' + C.fmtTime(d.checked_at * 1000) + '）' : '') + '</div>';
    }
  }

  function renderUpgradeStatus(s) {
    var box = document.getElementById('upgrade-banner');
    if (!box) return;
    var stage = UPGRADE_STAGES[s.stage] || s.stage || s.state;
    if (s.state === 'done') {
      box.innerHTML = '<div class="banner ok"><b>升级完成：已升到 ' + C.esc(s.target_version) + '</b>，页面即将刷新。</div>';
      setTimeout(function () { window.location.reload(); }, 3000);
    } else if (s.state === 'failed') {
      box.innerHTML = '<div class="banner error"><b>升级失败：' + C.esc(s.error || '未知原因') + '</b>' +
        (s.rolled_back ? '已自动回滚到上一版，当前版本仍可正常使用。' : '自动回滚也失败了，请联系管理员手动处理。') + '</div>';
    } else {
      box.innerHTML = '<div class="banner info"><b>正在升级到 ' + C.esc(s.target_version) + '…</b> ' +
        C.esc(stage) + (s.message ? '：' + C.esc(s.message) : '') + '</div>';
    }
  }

  function startUpgrade() {
    if (!upgradeTarget) return;
    if (!window.confirm('确定升级到 ' + upgradeTarget + ' 吗？\n升级前会自动备份数据库；任一步失败都会自动回滚到上一版。\n升级过程约需数分钟，期间页面会短暂不可用。')) return;
    C.api('/api/upgrade/request', { method: 'POST', body: { target_version: upgradeTarget } })
      .then(function () {
        C.toast('已提交升级请求，开始升级…');
        C.poll(async function () {
          var s = await C.api('/api/upgrade/status');
          renderUpgradeStatus(s);
          return s.state === 'done' || s.state === 'failed';
        }, { intervalMs: 3000, maxTries: 200 });
      })
      .catch(function (e) { C.toast('提交升级请求失败：' + e.message, true); });
  }

  async function loadUpgrade() {
    try {
      var d = await C.api('/api/upgrade/check');
      if (d.update_available) upgradeTarget = d.latest || '';
      renderUpgradeBanner(d);
      if (d.refreshing) {
        setTimeout(loadUpgrade, 15000);  // 后台刷新中，15 秒后再取一次
        return;
      }
      // 已有进行中的升级：继续轮询进度
      var s = await C.api('/api/upgrade/status');
      if (s.state === 'requested' || s.state === 'running') {
        upgradeTarget = s.target_version || '';
        C.poll(async function () {
          var st = await C.api('/api/upgrade/status');
          renderUpgradeStatus(st);
          return st.state === 'done' || st.state === 'failed';
        }, { intervalMs: 3000, maxTries: 200 });
      }
    } catch (e) {
      /* 检查失败不阻塞总览页 */
    }
  }

  /* 0.2.0：进行中任务（DB job + 脚本心跳/推导），每 5 秒刷新一次。 */
  function renderRunning(d) {
    var box = document.getElementById('running-body');
    if (!box) return;
    var cards = [];
    (d.jobs || []).forEach(function (j) {
      var p = j.progress || {};
      cards.push('<div class="card"><h3>任务 #' + C.esc(j.id) + ' · ' + C.esc(j.kind) + '</h3>' +
        '<div>' + C.statusTag(j.status) + ' <span class="meta">' + C.esc(p.phase || '') + '</span></div>' +
        '<div style="margin-top:8px">' + C.progressBar(p) + '</div>' +
        '<div class="meta">开始 ' + C.fmtTime(j.started_at) + ' · 已耗时 ' + C.fmtDuration(p.elapsed_s) + '</div></div>');
    });
    (d.scripts || []).forEach(function (t) {
      var p = t;
      var stale = t.stale ? ' <span class="prog-stale">已失联（心跳超过 10 分钟未更新，可能已中断）</span>' : '';
      var src = t.source === 'derived' ? ' <span class="meta">（进度由脚本日志推导）</span>' : '';
      cards.push('<div class="card"><h3>' + C.esc(t.label || t.task_id) + '</h3>' +
        '<div>' + C.statusTag(t.status) + ' <span class="meta">' + C.esc(t.phase || '') + '</span>' + stale + src + '</div>' +
        '<div style="margin-top:8px">' + C.progressBar(p) + '</div>' +
        '<div class="meta">开始 ' + C.fmtTime(t.started_at) + ' · 更新于 ' + C.fmtTime(t.updated_at) +
        ' · 速率 ' + C.fmtRate(p.rate_per_min) + '</div></div>');
    });
    box.innerHTML = cards.length ? '<div class="cards">' + cards.join('') + '</div>'
      : '<p class="muted">暂无进行中任务</p>';
  }

  async function loadRunning() {
    try {
      var d = await C.api('/api/jobs/running');
      renderRunning(d);
    } catch (e) {
      /* 取不到时保持上一次内容，不阻塞总览页 */
    }
  }

  async function load() {
    try {
      var d = await C.api('/api/dashboard');
      document.getElementById('app-version').textContent = d.version ? ('当前版本 ' + d.version) : '';
      var cards = (d.libraries || []).map(function (lib) {
        return '<div class="card"><h3>' + C.esc(lib.name) + '</h3>' +
          '<div class="stat-row"><div class="stat"><b>' + C.fmtNum(lib.files) + '</b><span class="meta">文件</span></div>' +
          '<div class="stat"><b>' + C.fmtBytes(lib.bytes) + '</b><span class="meta">体积</span></div>' +
          '<div class="stat"><b>' + C.fmtNum(lib.review_pending) + '</b><span class="meta">待复核</span></div></div>' +
          '<div class="meta">' + C.esc(lib.root || '') + '</div></div>';
      }).join('');
      document.getElementById('library-cards').innerHTML = cards || '<p class="empty">暂无库信息</p>';
      document.getElementById('stat-review').textContent = C.fmtNum(d.review_pending);
      document.getElementById('stat-today').textContent = C.fmtNum(d.today_new);
      var dup = d.dup_reclaimable || {};
      document.getElementById('stat-dup').textContent = C.fmtBytes(dup.bytes);
      document.getElementById('stat-dup-count').textContent = C.fmtNum(dup.count) + ' 个重复文件';
      var rows = (d.jobs_recent || []).map(function (j) {
        return '<tr><td class="path">' + C.esc(j.id) + '</td><td>' + C.esc(j.kind) + '</td>' +
          '<td>' + C.statusTag(j.status) + '</td><td>' + C.progressBar(j.progress) + '</td>' +
          '<td class="nowrap">' + C.fmtTime(j.started_at) + '</td>' +
          '<td class="nowrap">' + C.fmtTime(j.finished_at) + '</td></tr>';
      }).join('');
      document.getElementById('jobs-body').innerHTML = rows || '<tr><td colspan="6" class="muted">暂无任务</td></tr>';
    } catch (e) {
      C.showError(document.getElementById('dash-error'), e);
      document.getElementById('library-cards').innerHTML = '';
    }
  }
  load();
  loadUpgrade();
  loadRunning();
  setInterval(loadRunning, 5000);  /* 0.2.0：进行中任务每 5 秒刷新 */
})();
</script>
{% endblock %}
