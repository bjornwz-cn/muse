# NAS Curator（文件管家）0.1.1 —— 开发/复现用 compose。
# 飞牛正式安装走 fpk/ 内的 app/docker/docker-compose.yaml（由 fnpack 打包）。
# 挂载说明：
#   /vol1/1000:rw —— 三个库的归位必须写（只读挂载会使 apply 报 EROFS、功能不可用）；
#     安全控制靠 guard.py 排除规则 + App 自身逻辑，不是靠只读挂载。
#   模型缓存只读（与 P1/P2 一致的路径）。
#   数据卷 /vol2/docker/nas-curator/data：SQLite DB + config + 日志，放 /vol2
#     是因为 /vol1/1000 是用户文件区，DB/日志不该混进收件箱扫描范围。
# 端口：宿主 8765 -> 容器 8000（避开 8000/11434/11500）。
# 模型端点：容器内 127.0.0.1 指容器自身，必须用宿主网关地址 172.17.0.1
#   （ollama-cpu 11434 / ollama-gpu 11500 / ocr-service 8866 均在宿主 docker 网桥上）。
services:
  curator:
    image: nas-curator:0.1.1
    container_name: nas-curator
    restart: unless-stopped
    environment:
      - CURATOR_DB=/data/nas-curator.db
      - CURATOR_CONFIG_DIR=/data/config
      - HF_HUB_OFFLINE=1
      - HF_HUB_CACHE=/vol2/@appdata/marvis-app/data/home/agent-memory/media-curator/models
      - LLM_HOST=http://172.17.0.1:11434
      - SEM_HOST=http://172.17.0.1:11500
      - OCR_URL=http://172.17.0.1:8866
      # 火山 Ark key：启动时注入（本机开发用 ${ARK_PLAN_KEY:-}），绝不写进本文件。
      # 正式安装后由向导页写入 /data/config/.env.local（600），页面只显掩码。
      - ARK_PLAN_KEY=${ARK_PLAN_KEY:-}
      - ARK_PAYG_KEY=${ARK_PAYG_KEY:-}
    ports:
      - "8765:8000"
    volumes:
      - /vol1/1000:/vol1/1000:rw
      - /vol2/@appdata/marvis-app/data/home/agent-memory/media-curator/models:/models:ro
      - /vol2/docker/nas-curator/data:/data:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/dashboard', timeout=5)"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
