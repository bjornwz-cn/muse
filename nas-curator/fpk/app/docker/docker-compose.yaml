# NAS Curator（文件管家）0.1.1 —— 飞牛 App compose（由 fnpack 打包）。
# 镜像须事先在 NAS 上 docker load（本机 VM 构建后传过去），故 pull_policy: never。
# 端口：${TRIM_SERVICE_PORT}（来自 manifest service_port=8765）-> 容器 8000。
#   不用向导端口字段（fn-fpk 已知坑：向导改端口后 TRIM_SERVICE_PORT 不变，
#   docker 应用的端口映射只认打包时固定的 service_port）。
# 挂载：
#   /vol1/1000:rw —— 三个库的归位必须写（只读挂载会使 apply 报 EROFS、功能不可用）；
#     安全控制靠 guard.py 排除规则 + App 自身逻辑，不是靠只读挂载。
#     注意：fnOS 应用默认无权访问用户文件；若安装后容器报 /vol1/1000 不可写，
#     须在应用设置页授权目录（TRIM_DATA_ACCESSIBLE_PATHS）或改用 root 模式。
#   模型缓存：与 media_core/config.json 的 model_dir 保持同一路径，只读。
#   数据卷：fnOS 标准 @appshare 的 data 子目录（SQLite DB + config + 日志）。
# 模型端点：容器内 127.0.0.1 指容器自身，必须用宿主网关地址 172.17.0.1
#   （ollama-cpu 11434 / ollama-gpu 11500 / ocr-service 8866 均在宿主 docker 网桥上）。
services:
  curator:
    image: nas-curator:0.1.1
    container_name: nas-curator
    restart: unless-stopped
    pull_policy: never
    environment:
      - CURATOR_DB=/data/nas-curator.db
      - CURATOR_CONFIG_DIR=/data/config
      - HF_HUB_OFFLINE=1
      - HF_HUB_CACHE=/vol2/@appdata/marvis-app/data/home/agent-memory/media-curator/models
      - LLM_HOST=http://172.17.0.1:11434
      - SEM_HOST=http://172.17.0.1:11500
      - OCR_URL=http://172.17.0.1:8866
      # 火山 Ark key：不在此写。安装后在向导页输入进 /data/config/.env.local（600），页面只显掩码。
      - ARK_PLAN_KEY=${ARK_PLAN_KEY:-}
      - ARK_PAYG_KEY=${ARK_PAYG_KEY:-}
    ports:
      - "${TRIM_SERVICE_PORT}:8000"
    volumes:
      - /vol1/1000:/vol1/1000:rw
      - /vol2/@appdata/marvis-app/data/home/agent-memory/media-curator/models:/vol2/@appdata/marvis-app/data/home/agent-memory/media-curator/models:ro
      - /${TRIM_APPDEST_VOL}/@appshare/${TRIM_APPNAME}/data:/data:rw
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/dashboard', timeout=5)"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
